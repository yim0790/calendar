<!-- 달력 위젯 앱 화면 구조 (PC Electron·폰 PWA 공통) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달력</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#283c50">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="달력">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget" id="widget">
  <header class="top">
    <span id="title"></span>
    <div class="nav">
      <button id="today" type="button" title="오늘 달로 이동" aria-label="오늘 달로 이동">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="ringGap"><rect width="24" height="24" fill="#fff"/><rect x="5.6" y="0" width="4.3" height="7.6" rx="2.1" fill="#000"/><rect x="14.1" y="0" width="4.3" height="7.6" rx="2.1" fill="#000"/></mask></defs><g mask="url(#ringGap)"><rect x="2.6" y="3.8" width="18.8" height="18" rx="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2.6 7.4a3.6 3.6 0 0 1 3.6-3.6h11.6a3.6 3.6 0 0 1 3.6 3.6V9.4H2.6z" fill="currentColor"/></g><rect x="6.6" y="0.8" width="2.3" height="5.6" rx="1.15" fill="currentColor"/><rect x="15.1" y="0.8" width="2.3" height="5.6" rx="1.15" fill="currentColor"/><rect x="11" y="11.4" width="2.9" height="2.9" rx=".4" fill="currentColor"/><rect x="15.6" y="11.4" width="2.9" height="2.9" rx=".4" fill="currentColor"/><rect x="6.4" y="16.2" width="2.9" height="2.9" rx=".4" fill="currentColor"/><rect x="11" y="16.2" width="2.9" height="2.9" rx=".4" fill="currentColor"/><rect x="15.6" y="16.2" width="2.9" height="2.9" rx=".4" fill="currentColor"/></svg>
      </button>
      <button id="prev" type="button" title="이전 달" aria-label="이전 달">←</button>
      <button id="next" type="button" title="다음 달" aria-label="다음 달">→</button>
      <button id="menu" type="button" title="설정" aria-label="설정">☰</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
  <footer class="foot" id="sync"></footer>

  <!-- 로그인 안내 (로그인 전·설정 오류 시 표시) -->
  <div class="login" id="loginBox">
    <div class="card">
      <p id="loginMsg"></p>
      <button id="loginBtn" type="button">구글 계정으로 로그인</button>
    </div>
  </div>

  <!-- 날짜 편집창 -->
  <div class="editor" id="editor" role="dialog" aria-label="일정 편집">
    <div class="eh"><span id="edate"></span><button id="save" type="button" title="저장 (Enter)">✓</button></div>
    <div class="rows" id="rows"></div>
    <div class="pal" id="pal"></div>
    <div class="tools"><b>Enter = 저장</b> · Shift+Enter = 다음 줄 · Esc = 닫기<br>기호 버튼 = • → ★ → ✔ · ● = 글자색 · □ = 완료<br>빈 줄에서 Backspace = 줄 삭제</div>
  </div>

  <!-- 설정창 -->
  <div class="settings" id="settings" role="dialog" aria-label="설정">
    <h4>위젯 배경</h4>
    <label>색상</label>
    <div class="swatches" id="swatches"></div>
    <label>직접 선택 <input type="color" id="picker"></label>
    <label>투명도 <b id="alphaTxt"></b></label>
    <input type="range" id="alpha" min="0" max="95">
    <h4 class="gap">달력 글자색</h4>
    <div class="swatches" id="tswatches"></div>
    <label>직접 선택 <input type="color" id="tpicker"></label>
    <h4 class="gap">동기화</h4>
    <div class="acc"><span id="syncState"></span><button id="syncNow" type="button" disabled>지금 동기화</button></div>
    <h4 class="gap">계정</h4>
    <div class="acc"><span id="accName"></span><button id="login" type="button" disabled>구글 로그인</button></div>
    <button class="close" id="closeSet" type="button">닫기</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
